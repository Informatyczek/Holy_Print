<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koszyk | Holy Print</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbf5ec">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/jersey-10-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/products.js" defer></script>
  <script src="assets/js/icons.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/pages/cart.js" defer></script>
</head>
<body data-page="cart">
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="page-hero" style="padding-bottom:64px">
      <div class="container page-hero__inner">
        <ol class="steps-bar" aria-label="Etapy zamówienia">
          <li class="is-current"><span class="steps-bar__dot">1</span>Koszyk</li>
          <li><span class="steps-bar__dot">2</span>Dane i dostawa</li>
          <li><span class="steps-bar__dot">3</span>Potwierdzenie</li>
        </ol>
        <h1 class="page-hero__title">Twój koszyk</h1>
      </div>
      <div class="edge-clouds edge-clouds--bottom" style="--edge: var(--bg)" aria-hidden="true"></div>
    </section>

    <section class="section section--tight" style="padding-top:24px">
      <div class="container cart-layout" id="cart-root"></div>
    </section>

    <section class="section section--soft" id="upsell" hidden aria-labelledby="upsell-title">
      <div class="edge-clouds edge-clouds--top" style="--edge: var(--bg-soft)" aria-hidden="true"></div>
      <div class="container">
        <div class="section-head">
          <p class="eyebrow"><span data-icon="sparkle"></span>Dorzuć do paczki</p>
          <h2 class="h2" id="upsell-title">Może jeszcze jeden patron?</h2>
        </div>
        <div class="grid-products" id="upsell-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
